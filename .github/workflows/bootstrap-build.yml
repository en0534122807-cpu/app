name: Seed and build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  build:
    name: Prepare source and compile APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore app source and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload-*.b64 | base64 --decode > /tmp/mila-kadima.tar.xz
          mkdir -p /tmp/mila-kadima
          tar -xJf /tmp/mila-kadima.tar.xz -C /tmp/mila-kadima
          rsync -a /tmp/mila-kadima/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-build.yml
          python3 scripts/validate_project.py

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Mila Kadima Android app source"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: mila-kadima-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo '## מילה קדימה — APK מוכן' >> "$GITHUB_STEP_SUMMARY"
          echo 'הקובץ app-debug.apk זמין להורדה מתוך Artifacts של הריצה.' >> "$GITHUB_STEP_SUMMARY"
